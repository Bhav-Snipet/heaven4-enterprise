<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Heaven4 Enterprise</title>
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Polyfill for sockjs-client in Vite -->
    <script>
      if (typeof global === 'undefined') {
        window.global = window;
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500/20 selection:text-amber-300">
    <div id="root">
      <!-- Instant 0ms Inline HTML/CSS Splash Loader before React JS parses -->
      <div style="min-height:100vh;background:#030712;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#ffffff;padding:1rem;">
        <div style="width:4.5rem;height:4.5rem;border-radius:1.25rem;background:linear-gradient(135deg,#6366f1,#4f46e5);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(99,102,241,0.4);margin-bottom:1.5rem;animation:pulse 2s cubic-bezier(0.4,0,0.6,1) infinite;">
          <span style="font-weight:900;font-size:2.25rem;color:#ffffff;line-height:1;">H</span>
        </div>
        <h1 style="font-size:1.75rem;font-weight:800;letter-spacing:-0.025em;color:#ffffff;margin:0 0 0.5rem 0;background:linear-gradient(to right,#ffffff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
          Heaven4 <span style="color:#818cf8;">Enterprise</span>
        </h1>
        <p style="font-size:0.875rem;color:#64748b;margin:0 0 2rem 0;font-weight:500;">
          Loading application engine...
        </p>
        <div style="width:2.5rem;height:2.5rem;border:3px solid rgba(255,255,255,0.1);border-top-color:#818cf8;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
          @keyframes pulse { 0%,100%{ opacity:1;transform:scale(1); } 50%{ opacity:0.85;transform:scale(0.96); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
